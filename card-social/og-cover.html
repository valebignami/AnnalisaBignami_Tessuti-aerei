<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Card social · italiano</title>

<!-- Sorgente di og-cover.png, l'immagine che si vede quando il link del sito
     viene condiviso in chat o sui social.

     Il testo e' stampato dentro il PNG: cambiare i meta og: nella pagina non lo
     tocca. Quindi ogni volta che cambia il nome della disciplina, l'elenco dei
     corsi o le zone, va rifatta anche l'immagine.

     Come si rifa': si apre questo file in un browser con la finestra a
     1200x630 e si salva uno screenshot su og-cover.png, nella cartella
     principale. Le misure devono restare 1200x630: sono dichiarate in
     og:image:width e og:image:height, e sono il formato che le chat si
     aspettano.

     Attenzione: WhatsApp e Facebook tengono in cache le anteprime. Un link gia'
     condiviso continua a mostrare la card vecchia ancora per giorni. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }

  .card {
    position: relative; width: 1200px; height: 630px;
    background: linear-gradient(152deg, #FFFFFF 0%, #FFFBF6 46%, #FDF0E6 100%);
    font-family: Arial, Helvetica, sans-serif;
    color: #33211C;
    overflow: hidden;
  }

  .teli { position: absolute; top: 0; right: 0; width: 500px; height: 630px; }

  .copy {
    position: absolute; left: 93px; top: 0; height: 630px;
    display: flex; flex-direction: column; justify-content: center;
  }

  .eyebrow {
    font-size: 20px; font-weight: 700; letter-spacing: 0.3em;
    text-transform: uppercase; color: #EE8763;
    margin-bottom: 26px;
  }

  .name {
    font-family: "Trebuchet MS", "Segoe UI", "Lucida Grande", Verdana, sans-serif;
    font-weight: 700; font-size: 88px; line-height: 1.02;
    letter-spacing: -0.01em; color: #33211C;
    margin-bottom: 22px;
  }

  .disc  { font-size: 31px; line-height: 1.3; color: #33211C; margin-bottom: 14px; }
  .disc .sep, .places .sep { color: #B99C90; padding: 0 4px; }

  .places { font-size: 26px; line-height: 1.3; color: #7E655C; margin-bottom: 30px; }

  .pill {
    align-self: flex-start;
    display: flex; align-items: center; gap: 12px;
    background: #EE8763; color: #FFFFFF;
    font-size: 21px; font-weight: 700;
    padding: 14px 28px; border-radius: 999px;
  }
  .pill i { width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF; }
</style>
</head>
<body>
<div class="card">

  <svg class="teli" viewBox="0 0 500 630" fill="none">
    <defs>
      <linearGradient id="gA" x1="0" y1="0" x2="0.25" y2="1">
        <stop offset="0%"   stop-color="#8FD8C7"/>
        <stop offset="45%"  stop-color="#6FC6B3"/>
        <stop offset="100%" stop-color="#57BCA6"/>
      </linearGradient>
      <linearGradient id="gB" x1="0" y1="0" x2="0.25" y2="1">
        <stop offset="0%"   stop-color="#F3BAC6"/>
        <stop offset="45%"  stop-color="#EDA2B1"/>
        <stop offset="100%" stop-color="#E88EA1"/>
      </linearGradient>
      <linearGradient id="gC" x1="0" y1="0" x2="0.25" y2="1">
        <stop offset="0%"   stop-color="#F8D9A2"/>
        <stop offset="45%"  stop-color="#F2C57C"/>
        <stop offset="100%" stop-color="#EFB962"/>
      </linearGradient>
      <linearGradient id="gD" x1="0" y1="0" x2="0.25" y2="1">
        <stop offset="0%"   stop-color="#F3A183"/>
        <stop offset="45%"  stop-color="#EE8763"/>
        <stop offset="100%" stop-color="#EA764F"/>
      </linearGradient>
    </defs>

    <!-- Ogni telo: bordi che si stringono a meta' altezza, come il tessuto
         appeso vero. La riga chiara dentro e' la piega. -->
    <g>
      <path fill="url(#gA)" d="M12,-5 C 6,120 32,240 28,350 C 24,470 10,560 16,640 L106,640 C 112,560 96,470 100,350 C 104,240 118,120 112,-5 Z"/>
      <path stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2.6" stroke-linecap="round"
            d="M82,40 C 72,190 88,340 76,500"/>
    </g>
    <g>
      <path fill="url(#gB)" d="M145,-5 C 139,120 165,240 161,350 C 157,470 143,560 149,640 L239,640 C 245,560 229,470 233,350 C 237,240 251,120 245,-5 Z"/>
      <path stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2.6" stroke-linecap="round"
            d="M215,40 C 205,190 221,340 209,500"/>
    </g>
    <g>
      <path fill="url(#gC)" d="M278,-5 C 272,120 298,240 294,350 C 290,470 276,560 282,640 L372,640 C 378,560 362,470 366,350 C 370,240 384,120 378,-5 Z"/>
      <path stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2.6" stroke-linecap="round"
            d="M348,40 C 338,190 354,340 342,500"/>
    </g>
    <g>
      <path fill="url(#gD)" d="M411,-5 C 405,120 431,240 427,350 C 423,470 409,560 415,640 L505,640 C 511,560 495,470 499,350 C 503,240 517,120 511,-5 Z"/>
      <path stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2.6" stroke-linecap="round"
            d="M481,40 C 471,190 487,340 475,500"/>
    </g>
  </svg>

  <div class="copy">
    <p class="eyebrow">Acrobatica Aerea</p>
    <h1 class="name">Annalisa<br>Bignami</h1>
    <p class="disc">Tessuti aerei<span class="sep">·</span>Cerchio aereo<span class="sep">·</span>Preparazione fisica</p>
    <p class="places">Milano<span class="sep">·</span>Valtellina<span class="sep">·</span>Lombardia</p>
    <div class="pill"><i></i>Prima lezione di prova gratuita</div>
  </div>

</div>
</body>
</html>
